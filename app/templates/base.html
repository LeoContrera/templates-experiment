<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Sistema Shop{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                black: '#000000',
              }
            }
          }
        }
    </script>
</head>
<body class="bg-gray-50 p-4 md:p-8 font-sans min-h-screen flex flex-col">

    <div class="max-w-7xl mx-auto w-full bg-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex flex-col min-h-[85vh]">
        
        <nav class="border-b-2 border-black px-6 py-4 flex justify-between items-center bg-white">
            
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="font-bold text-lg">admin</span>
            </div>

            <div class="hidden md:flex gap-6 font-medium text-sm lg:text-base">
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Panel</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Reportes</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Cajas</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Ventas</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Inventario</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Productos</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Usuarios</a>
                <a href="#" class="hover:underline hover:text-gray-600 transition-colors">Ayuda</a>
            </div>

            <div>
                <button class="border-2 border-black px-4 py-1 text-sm font-bold hover:bg-black hover:text-white transition-all duration-200 uppercase tracking-wide">
                    Cerrar sesión
                </button>
            </div>
        </nav>

        <main class="flex-grow p-6 md:p-10 flex flex-col">
            
            <h1 class="text-3xl md:text-4xl font-black text-center mb-8 uppercase tracking-tighter">
                {% block titulo %}
                    TITULO POR DEFECTO
                {% endblock %}
            </h1>

            <div class="border-2 border-black p-6 md:p-8 h-full flex-grow bg-white relative">
                <div class="absolute -top-3 left-4 bg-white px-2 border-l-2 border-r-2 border-black text-xs font-bold">
                    CONTENIDO
                </div>

                {% block content %}
                    {% endblock %}
            </div>

        </main>

    </div>

</body>
</html>
